# Configuration and Model Hyperparameters for leaderboard_boost.ipynb
# Edit this file directly to tweak specialist models, OOD validation holdouts, SSL parameters, and blend weights.

random_seed: 42

vectorizers:
  ood_validation:
    word_tfidf:
      ngram_range: [1, 3]
      min_df: 3
      max_features: 85000
      sublinear_tf: true
    char_wb_tfidf:
      ngram_range: [3, 5]
      analyzer: "char_wb"
      min_df: 5
      max_features: 85000
      sublinear_tf: true
    char_cross_tfidf:
      ngram_range: [3, 5]
      analyzer: "char"
      min_df: 5
      max_features: 85000
      sublinear_tf: true
    mask_tfidf:
      ngram_range: [1, 4]
      token_pattern: '\S+'
      min_df: 5
      max_features: 80000
      sublinear_tf: true

  full_transductive:
    word_tfidf:
      ngram_range: [1, 3]
      min_df: 3
      max_features: 95000
      sublinear_tf: true
    char_wb_tfidf:
      ngram_range: [3, 5]
      analyzer: "char_wb"
      min_df: 5
      max_features: 95000
      sublinear_tf: true
    char_cross_tfidf:
      ngram_range: [3, 5]
      analyzer: "char"
      min_df: 5
      max_features: 95000
      sublinear_tf: true
    mask_tfidf:
      ngram_range: [1, 4]
      token_pattern: '\S+'
      min_df: 5
      max_features: 85000
      sublinear_tf: true

ood_holdout_domains:
  - "4. Book / Novel Summary"
  - "5. Film / TV / Review"

specialists:
  # Spec 1: 4-View N-Gram Logistic Regression
  lr_4v:
    C: 2.0
    max_iter: 1000

  # Spec 2: 4-View N-Gram Calibrated LinearSVC
  svc_4v:
    C: 0.5
    cv: 3

  # Spec 3: Topic-Masked Syntactic Skeleton Logistic Regression
  mask_lr:
    C: 2.0
    max_iter: 1000

  # Spec 4: Formatting-Free Pure + Genre-Z Stylometric LightGBM (96 features)
  lgb_pure:
    n_estimators: 400
    learning_rate: 0.04
    num_leaves: 31
    min_child_samples: 40
    colsample_bytree: 0.7
    subsample: 0.8
    n_jobs: -1
    verbose: -1

  # Spec 5: Regularized Damped-Structural + Stylo LightGBM (108 features)
  lgb_struct:
    n_estimators: 400
    learning_rate: 0.04
    num_leaves: 31
    min_child_samples: 50
    colsample_bytree: 0.45
    subsample: 0.8
    reg_alpha: 1.0
    reg_lambda: 2.0
    n_jobs: -1
    verbose: -1

blend_weights:
  nofmt:
    lr_4v: 0.25
    svc_4v: 0.25
    mask_lr: 0.15
    lgb_pure: 0.35
  stage1_fusion:
    nofmt: 0.70
    struct: 0.30

semi_supervised:
  # Pseudo-label confidence thresholds on unlabeled.csv
  high_conf_threshold_hi: 0.96
  high_conf_threshold_lo: 0.04
  pseudo_weight: 0.5
  ssl_lr:
    C: 2.0
    max_iter: 1000
  ssl_lgb_struct:
    n_estimators: 400
    learning_rate: 0.04
    num_leaves: 31
    min_child_samples: 50
    colsample_bytree: 0.45
    subsample: 0.8
    reg_alpha: 1.0
    reg_lambda: 2.0
    n_jobs: -1
    verbose: -1
  fusion:
    stage1_weight: 0.75
    ssl_weight: 0.25
    ssl_lr_weight: 0.65
    ssl_struct_weight: 0.35
