# C1 v3: word (1-2) TF-IDF + raw char (1-5) TF-IDF (case, spacing and line breaks kept) + word (1-3)-grams over
# text-distorted input (words outside the 100 most frequent training words masked) -> logistic regression.
# Chosen by the pre-registered topic-held-out CV rule (configs/selection/tfidf_lr.yaml; select_design.py;
# results/selection/tfidf_lr/), using train.csv labels only. Earlier versions (v1: word + char_wb, public 0.88583;
# v2: k=300, C=64, public 0.96374) are in git history.
model: tfidf_lr
params:
  C: 4.0
  word_ngrams: [1, 2]
  char_ngrams: [1, 5]
  word_min_df: 2
  char_min_df: 3
  max_features: 300000
  lowercase: true
  char_analyzer: char
  distort_k: 100
  distort_ngrams: 3
