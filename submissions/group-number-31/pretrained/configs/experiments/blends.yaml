# The members of blends A, B and C, 5-fold stratified CV on all 10,000 rows of train.csv (seed 42), the same
# jobs as the runs behind the Kaggle files. Train data only: no extra labelled files.
#   python run_all.py --profile blends                       # ~4 h on two 12 GB GPUs
#   python run_all.py --profile blends --only lm_gpt2,lm_gpt2_medium,binoculars_qwen05b,binoculars_qwen15b   # blend B
#   python make_submission.py --run <run dirs> --weights <w> --name <file>              # weights: ../predict.py
# The runs used for the files came from sessions 20261030-135404_ood and 20261031_var (same jobs and settings).
description: Members of blends A, B and C, 5-fold CV, seed 42.

defaults:
  cv.scheme: stratified
  cv.n_folds: 5

jobs:
  # ------------------------------------------------------------ LM features (GPU, features cached)
  - {name: lm_gpt2,            config: lm_gpt2,            resource: gpu, cost: 4}    # A, B, C
  - {name: lm_gpt2_medium,     config: lm_gpt2_medium,     resource: gpu, cost: 6}    # A, B, C
  - {name: binoculars_qwen05b, config: binoculars_qwen05b, resource: gpu, cost: 10}   # A, B, C
  - {name: binoculars_qwen15b, config: binoculars_qwen15b, resource: gpu, cost: 20}   # B, C
  - {name: lm_gpt2_nostyle,    config: lm_gpt2_nostyle,    resource: gpu, cost: 4}    # A

  # ------------------------------------------------------------ fine-tunes (GPU)
  - {name: ft_distilroberta,   config: ft_distilroberta,   resource: gpu, cost: 12}   # A, C
  - {name: ft_modernbert_base, config: ft_modernbert_base, resource: gpu, cost: 33}   # A
  - {name: ft_roberta_base,    config: ft_roberta_base,    resource: gpu, cost: 15}   # A

report:
  ensemble_groups: [main]
