 "matplotlib==3.11.2","joblib==1.6.0","python-dotenv==1.2.4",
 "jupyterlab>=4,<5","nbconvert>=7,<8","nbformat>=5,<6","ipykernel>=6,<8",
 "torch==2.15.0","transformers==5.22.2","huggingface-hub==2.4.0"
]
